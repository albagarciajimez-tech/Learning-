<script>
const COURSES = {
  '1': {
    label: '1.º ESO', sub: 'De los primeros diálogos a las historias y los planes de futuro.',
    units: [
      {
        id:'u1', title:'This Is My Life', tag:'Identity & introductions', emoji:'👋',
        goals:['Presentarte y hablar de otras personas','Usar be, pronombres y posesivos','Describir tu colegio y tu entorno'],
        theory:[['Verb to be','I am / you are / he, she, it is / we, they are. Negativo: am not, isn’t, aren’t. Preguntas: Are you…? Is she…?'],['Possessive adjectives','my, your, his, her, its, our, their. Ejemplo: Her name is Lily. Our class is friendly.'],['There is / There are','There is + singular; there are + plural. There isn’t a library. Are there any computers?']],
        vocab:[['surname','apellido'],['classmate','compañero de clase'],['timetable','horario'],['subject','asignatura'],['friendly','amable'],['quiet','tranquilo'],['library','biblioteca'],['neighbour','vecino']],
        grammar:[['My best friend ___ from Scotland.','is','My best friend = he/she'],['They ___ in Year 7.','are'],['I ___ not fourteen.','am'],['___ your teacher British?','Is'],['This is Oliver. ___ sister is twelve.','His'],['There ___ twenty-eight students in my class.','are']],
        reading:{title:'A new student',text:`Hi! I’m Sophie, and I’m twelve years old. My family is from Manchester, but our new home is in Bristol. My brother, Jack, is ten. He is funny but very noisy! My new school is near a big park. There are twenty-six students in my class. My favourite subject is English because our teacher tells amazing stories. At first, I’m a little nervous, but my classmates are friendly. On Fridays, I go to the school library with Mia, my new friend.`,qs:[['Where is Sophie’s new home?',['Manchester','Bristol','London'],1],['How many students are in her class?',['Twenty-six','Twenty','Sixteen'],0],['Why does Sophie like English?',['The books are short','The teacher tells stories','There is no homework'],1]]},
        listening:{title:'Meet Daniel',script:`Hello! My name is Daniel. I'm thirteen and I'm a new student. My parents are from Spain, but I'm from London. My favourite subjects are science and art. There are two cats at home. My sister is eleven and her name is Emma. Our school starts at half past eight.`,qs:[['How old is Daniel?',['Eleven','Twelve','Thirteen'],2],['Which subjects does he like?',['Science and art','History and music','English and PE'],0],['What time does school start?',['Eight o’clock','Half past eight','Nine o’clock'],1]]},
        writing:{title:'My student profile',prompt:'Write a profile for the school website. Include your name, age, town, family, favourite subjects and something special about you.',min:60,max:90,starters:['My name is…','I live in…','My favourite subject is… because…'],checks:['I use am, is and are correctly.','I include at least two possessive adjectives.','I write full sentences with capital letters.'],sample:`My name is Alex and I’m twelve years old. I live in a small town near Barcelona. My family is very important to me. My sister is nine and her favourite subject is art. My school is quite big, but my classroom is friendly. There are twenty-seven students in my class. My favourite subject is English because I love learning new words. In my free time, I play basketball and draw comics.`}
      },
      {
        id:'u2',title:'Everyday Heroes',tag:'Routines & free time',emoji:'⏰',
        goals:['Hablar de rutinas y hábitos','Formar preguntas con do y does','Usar adverbios de frecuencia'],
        theory:[['Present Simple','I/you/we/they play; he/she/it plays. En tercera persona: watch → watches, study → studies, go → goes.'],['Negatives and questions','I don’t play. She doesn’t play. Do you walk to school? Does he study English? Después de does, verbo base.'],['Frequency and questions','always, usually, often, sometimes, never. What time…? Where…? How often…?']],
        vocab:[['wake up','despertarse'],['get dressed','vestirse'],['have breakfast','desayunar'],['brush your teeth','cepillarse los dientes'],['catch the bus','coger el autobús'],['do homework','hacer los deberes'],['tidy up','ordenar'],['go to bed','acostarse']],
        grammar:[['She ___ (watch) TV after dinner.','watches'],['My friends ___ (study) at the library.','study'],['He ___ (not / like) early mornings.','does not like|doesn’t like|doesn\'t like'],['___ your sister play tennis?','Does'],['How often ___ you read in English?','do'],['Lucas ___ (go) to bed at ten.','goes']],
        reading:{title:'A different school day',text:`On weekdays, Amir wakes up at seven. He usually has toast and fruit for breakfast. He walks to school with his neighbour, Ben. School starts at eight thirty. Amir likes science, but he doesn’t enjoy maths very much. After school, he often plays football in the park. On Tuesdays, he helps his grandfather in a small garden. He never uses his phone at the dinner table because his family likes talking together. At weekends, Amir sometimes makes pancakes for everyone.`,qs:[['How does Amir go to school?',['By bus','On foot','By bike'],1],['What does Amir do on Tuesdays?',['Helps his grandfather','Plays the guitar','Visits a museum'],0],['Why doesn’t he use his phone at dinner?',['It is broken','He is studying','The family likes talking'],2]]},
        listening:{title:'A busy Saturday',script:`Hi, I'm Ruby. On Saturdays I usually get up at nine. I always walk my dog before breakfast. At eleven I meet my friends at the sports centre. We sometimes play badminton. In the afternoon I do my homework, and in the evening my family watches a film. I never go to bed before ten on Saturdays.`,qs:[['What does Ruby do before breakfast?',['Walks her dog','Does homework','Plays badminton'],0],['Where does she meet her friends?',['At school','At the sports centre','At the cinema'],1],['When does she do her homework?',['In the morning','In the afternoon','At night'],1]]},

        reading:{title:'The house at number nine',text:`My aunt lives in a colourful house near the river. There is a tiny garden behind the house and a balcony upstairs. The kitchen is next to the living room. There are some old photographs above the fireplace. My favourite room is the attic because there is a small reading corner under the window. There isn’t a television there, so it is a peaceful place. The town centre is only ten minutes away on foot. There is a bakery opposite the post office and a lovely bridge over the river.`,qs:[['Where is the garden?',['Behind the house','In front of the house','On the balcony'],0],['Why does the writer like the attic?',['It has a big TV','It is peaceful','It has a kitchen'],1],['What is opposite the post office?',['A bridge','A library','A bakery'],2]]},

        writing:{title:'The best place for a trip',prompt:'Compare two places for a class trip and explain which one you recommend. Use three comparatives and two superlatives.',min:80,max:110,starters:['In my opinion, … is better than…','The most exciting activity is…','I would choose… because…'],checks:['I use than with comparatives.','I use the with superlatives.','I explain my final choice.'],sample:`Our class could visit a science museum or a nature park. The museum is closer to school and its tickets are cheaper. However, the nature park is more exciting for students who love outdoor activities. It has the most beautiful walking routes in the area. The museum has the best interactive exhibitions and it is as interesting as the park for curious students. I would choose the nature park because we spend a lot of time indoors. We could learn about animals, take photographs and enjoy a memorable day together.`}

        reading:{title:'The mystery of the missing bag',text:`It was raining heavily when Jess left the library. She was carrying a blue bag with her favourite books inside. While she was waiting for the bus, she noticed a small dog near a bench. She stopped to help it. Suddenly, her bus arrived and Jess jumped on. Ten minutes later, she looked down. Her bag was missing! She called the library, but the librarian didn’t find it. Finally, the driver said that a passenger had given him a blue bag. Jess was relieved. The books were safe, and she never forgot the little dog.`,qs:[['What was the weather like?',['Sunny','Rainy','Windy'],1],['What distracted Jess?',['A dog','A phone call','A friend'],0],['Who had her bag?',['The librarian','A neighbour','The bus driver'],2]]},
        listening:{title:'The power cut',script:`We were eating dinner when all the lights suddenly went off. My little sister was telling a joke, so everyone stopped laughing. Dad found a torch while Mum was looking for candles. Outside, our neighbours were standing in the street. A few minutes later, the lights came back on. We finished dinner and told stories about our strangest evenings.`,qs:[['What were they doing when the lights went off?',['Watching TV','Eating dinner','Sleeping'],1],['What did Dad find?',['A torch','A candle','A radio'],0],['Where were the neighbours?',['In the kitchen','At the shop','In the street'],2]]},
        writing:{title:'An unexpected adventure',prompt:'Write a short story with a beginning, a problem and an ending. Use both past tenses and the words while, suddenly and finally.',min:90,max:120,starters:['It was a cold evening…','While I was…','Suddenly, …','Finally, …'],checks:['I use Past Continuous for background.','I use Past Simple for main events.','My story has a clear ending.'],sample:`It was a cold evening and I was walking home from football practice. The streets were quiet and the wind was blowing. Suddenly, I heard a strange noise behind a tree. While I was looking around, a tiny puppy ran towards me. It was shaking and looked frightened. I picked it up and called my parents. We took it to a nearby veterinary clinic, where the vet checked its collar. Fortunately, the puppy had a phone number on its tag. Finally, we called its owner, who was very happy to find it. I felt like a real hero.`}

        reading:{title:'The photograph in the drawer',text:`When Maya was clearing her grandmother’s house, she discovered a photograph she had never seen before. It showed a young woman standing outside a recording studio in 1974. Her grandmother, who had always seemed rather shy, was holding a guitar. Maya asked about it, and an extraordinary story emerged. Before she became a nurse, her grandmother had spent two years performing with a local band. They used to play at small venues, and every Friday they would travel by van to another town. She had been preparing to record an album when the band broke up. Maya realised that she had known only one chapter of her grandmother’s life. That evening, they listened to the band’s old recordings and talked for hours.`,qs:[['What surprised Maya?',['A photograph of her grandmother with a guitar','An expensive necklace','An unpublished novel'],0],['Why was the album never recorded?',['They lost the studio','The band broke up','The guitar was broken'],1],['What did they do that evening?',['Visited a museum','Met the band','Listened to old recordings'],2]]},
        listening:{title:'An unexpected reunion',script:`Last summer I was travelling through Edinburgh when I ran into my old school friend Nora. We hadn't spoken for nearly five years. She had been working at a community theatre, and she invited me to a rehearsal that evening. We used to perform in school plays together, so I went along. By the time the rehearsal ended, we'd made plans to meet again. I hadn't expected an ordinary holiday to bring back so many memories.`,qs:[['Where did the reunion take place?',['Edinburgh','Cardiff','Belfast'],0],['Where had Nora been working?',['At a newspaper','At a community theatre','At a university'],1],['What did they use to do together?',['Go camping','Play tennis','Perform in school plays'],2]]},
        writing:{title:'A story with a twist',prompt:'Write a 140–190-word story beginning with “I had never seen anything like it before.” Include a flashback, a complication and an unexpected ending.',min:140,max:190,starters:['I had never seen…','Earlier that day, I had…','While I was…, suddenly…','Eventually, I realised…'],checks:['I use at least three narrative tenses.','I include a clear turning point.','I organise the story into paragraphs.'],sample:`I had never seen anything like it before. A small wooden box was lying on my doorstep, with my name written in beautiful handwriting. Inside, there was an old photograph and a note: “Meet me where it all began.”

I had been wondering who had sent it when I recognised the place in the picture. It was the little café where my parents had first met. I used to go there with my grandfather when I was younger, but it had been closed for years.

I decided to visit the building. While I was looking through the dusty windows, a woman approached me and smiled. She explained that she had been my grandfather’s childhood friend. Before he died, he had asked her to give me a collection of his letters when I turned sixteen.

Suddenly, the mysterious message made sense. I had expected an adventure, but I found something far more valuable: a part of my family’s history.`}

        theory:[['Present Perfect Simple','have/has + past participle. I have finished the advert. Result, achievement, life experience.'],['Present Perfect Continuous','have/has been + -ing. We have been working for two hours. Duración/proceso; algunos verbos de estado no suelen usarse en continuo.'],['Question tags','You’ve finished, haven’t you? She doesn’t work here, does she? Afirmativa → tag negativa; negativa → tag afirmativa.']],
        vocab:[['target audience','público objetivo'],['entrepreneur','emprendedor'],['profit','beneficio'],['launch','lanzar'],['customer','cliente'],['advertise','publicitar'],['subscription','suscripción'],['affordable','asequible']],
        grammar:[['Our team ___ (develop) the app for six months. (process)','has been developing'],['She ___ (already / finish) the logo.','has already finished'],['They ___ (not / launch) the product yet.','have not launched|haven’t launched|haven\'t launched'],['You ___ (work) on this idea for months.','have been working'],['Your company sells online, ___?','doesn’t it|doesn\'t it'],['He hasn’t called the customer, ___?','has he']],
        reading:{title:'A problem worth solving',text:`For months, sixteen-year-old Leo had been noticing that older people in his neighbourhood struggled with complicated mobile apps. He and two classmates decided to create SimpleSteps, a set of easy-to-follow video tutorials. Since launching the project, the team has recorded twenty short lessons and attracted hundreds of viewers. They have also been collecting feedback from a local community centre. Their biggest challenge has been explaining technology without using technical language. Although the project hasn’t made a profit yet, it has already helped dozens of people book appointments and make video calls. Leo believes that a successful business should solve a real problem, rather than simply sell another product. Next month, they are going to present their idea to local investors.`,qs:[['Who is SimpleSteps designed to help?',['People learning complicated apps','Young professional gamers','Tourists booking hotels'],0],['How many tutorials have they recorded?',['Twelve','Twenty','Two hundred'],1],['What does Leo consider important?',['Selling the most expensive product','Attracting famous investors','Solving a real problem'],2]]},
        listening:{title:'The business pitch',script:`Good afternoon, investors. Our idea is called BorrowBox. For the past four months, we've been developing a website that helps neighbours borrow tools they rarely use. We've already interviewed fifty potential customers, and the response has been extremely positive. People don't want to buy a drill for one small job, do they? We haven't launched the full service yet, but we've tested it in two streets. We're looking for funding to expand across the town.`,qs:[['What can people borrow through BorrowBox?',['Books','Tools','Clothes'],1],['How many potential customers have they interviewed?',['Fifteen','Fifty','Five hundred'],1],['Where has the service been tested?',['In two streets','In two countries','At two schools'],0]]},
        writing:{title:'A persuasive business pitch',prompt:'Invent a business that solves an everyday problem. Describe the problem, solution, target customers, price and marketing. Write a convincing pitch of 140–190 words.',min:140,max:190,starters:['Have you ever struggled with…?','We have been developing…','Our target audience is…','What makes us different is…'],checks:['I use both Present Perfect forms.','I explain the customer’s problem and my solution.','I include a price, slogan and call to action.'],sample:`Have you ever wasted time looking for a quiet place to study? Our new service, StudySpot, is the solution. We connect students with affordable study spaces in cafés and community centres.

For the past three months, we have been interviewing teenagers about their study habits. Many have told us that libraries close too early or become crowded before exams. We have already partnered with three local cafés, and the feedback has been excellent.

Our target audience is students aged 14 to 20. For just €4 a month, members can reserve a desk, enjoy discounted drinks and access free revision resources. We have been developing a simple booking app, which will launch next term.

Our slogan is “Your space. Your focus. Your future.” Unlike other platforms, StudySpot supports small local businesses as well as students. Finding somewhere to work shouldn’t be difficult, should it?

Join our waiting list today and help us make studying easier for everyone.`}

      {
        id:'u3',title:'Our Changing World',tag:'Passive voice & sustainability',emoji:'♻️',

        theory:[['Passive formation','be + past participle. Active: People recycle glass. Passive: Glass is recycled.'],['Tense changes','The bridge was built; the waste is being collected; the project has been approved; the park will be opened.'],['By + agent','By se usa si importa quién hace la acción: The report was written by our class.']],
        vocab:[['waste','residuos'],['renewable','renovable'],['emissions','emisiones'],['landfill','vertedero'],['reusable','reutilizable'],['conserve','conservar'],['source','fuente'],['impact','impacto']],
        grammar:[['Plastic bottles ___ (recycle) in this factory.','are recycled'],['The new park ___ (open) last year.','was opened'],['More trees ___ (plant) next spring.','will be planted'],['The documents ___ (already / sign).','have already been signed'],['The street ___ (clean) at the moment.','is being cleaned'],['This song ___ (write) by a local artist in 1998.','was written']],
        reading:{title:'The school that changed its habits',text:`At Westbridge School, thousands of plastic bottles used to be thrown away every year. Last autumn, an environmental survey was carried out by a group of students. The results were presented to the head teacher, and a new plan was approved. Reusable bottles are now sold at a low price, water fountains have been installed and food waste is collected separately. A small garden is also being created behind the science block. The project has received support from local businesses, and more changes will be introduced next term. The students say that environmental problems cannot be solved overnight, but important progress can be made when a whole community works together.`,qs:[['Who carried out the survey?',['Local businesses','Students','The town council'],1],['What has been installed?',['Water fountains','Solar-powered buses','New computers'],0],['What is being created now?',['A sports hall','A cinema','A garden'],2]]},
        listening:{title:'How paper is recycled',script:`First, used paper is collected from homes and offices. It is taken to a recycling centre, where it is sorted and mixed with water. The mixture is cleaned to remove ink and other materials. Next, the paper is pressed into thin sheets and dried. Finally, new paper products are made. Recycling paper saves trees and energy, although some water is still needed during the process.`,qs:[['Where is used paper taken?',['A recycling centre','A school','A supermarket'],0],['What is removed from the mixture?',['Sugar','Ink','Plastic chairs'],1],['What happens after the paper is pressed?',['It is frozen','It is painted','It is dried'],2]]},
        writing:{title:'A school sustainability report',prompt:'Write a short report about an environmental problem at school and recommend solutions. Explain what has been done and what should be changed.',min:140,max:190,starters:['The problem was identified when…','At present, … is being…','It is recommended that…','As a result, …'],checks:['I include three passive constructions.','I suggest specific practical solutions.','I use a formal, objective tone.'],sample:`**Reducing Waste at Our School**

**Introduction**
This report examines the amount of rubbish produced in our school and suggests ways to reduce it. Information was collected from students during the last two weeks.

**Findings**
A large number of single-use bottles are bought every day. Although recycling bins have been installed, they are not always used correctly. In addition, too much food is thrown away after lunch. Students have been informed about these problems, but more practical action is needed.

**Recommendations**
Firstly, water fountains should be installed on every floor so that reusable bottles can be filled easily. Secondly, clear recycling signs should be displayed above all bins. Finally, leftover food could be collected and shared with a local charity when it is safe to do so.

**Conclusion**
If these changes are introduced, less waste will be produced and the school environment will be improved. Student volunteers could help monitor progress each month.`}

        grammar:[['If you heat ice, it ___ (melt).','melts'],['If it rains tomorrow, we ___ (stay) indoors.','will stay'],['If I ___ (have) more time, I would learn Japanese.','had'],['She would have passed if she ___ (study) harder.','had studied'],['If I were you, I ___ (apologise).','would apologise|would apologize'],['We won’t finish unless everyone ___ (help).','helps']],
        reading:{title:'One decision, many futures',text:`Last year, Priya almost decided not to enter a robotics competition. She had never built a robot before and was afraid of failing. Her science teacher encouraged her to join a team. “If you never try, you’ll never know what you can achieve,” he said. Priya accepted the challenge. The team spent weeks testing their design and eventually won a regional prize. Priya now says that if she had refused the invitation, she would have missed an amazing opportunity. She also believes that if schools offered more practical competitions, more students would discover new talents. Next year, she wants to mentor younger pupils because confidence grows when people support one another.`,qs:[['Why did Priya hesitate?',['She disliked science','She was afraid of failing','She was moving abroad'],1],['What did the team achieve?',['A regional prize','A national television show','A school holiday'],0],['What does she want to do next year?',['Open a business','Join a football club','Mentor younger pupils'],2]]},
        listening:{title:'Choices and consequences',script:`If I could change one decision from last year, I'd spend less time on my phone before exams. I didn't revise enough, so I felt stressed. If I'd planned my study time better, I would have felt more prepared. Now I make a weekly schedule. If I finish my homework early, I go for a walk. And if I stick to my plan this term, I think I'll feel much calmer during the tests.`,qs:[['What would the speaker change?',['Phone use before exams','Their school','Their sports team'],0],['What was the consequence of not revising enough?',['Boredom','Stress','Illness'],1],['What do they do after finishing homework early?',['Watch a film','Go shopping','Go for a walk'],2]]},
        writing:{title:'If I could improve my town…',prompt:'Write a 140–190-word opinion piece about changes that would make your town better. Include real consequences, hypothetical changes and one past regret.',min:140,max:190,starters:['If the council invested in…','If I were the mayor…','If we had acted earlier…','In my view…'],checks:['I include first, second and third conditionals.','I explain the consequences of my ideas.','I support my opinion with examples.'],sample:`If I could improve my town, I would start by creating safer spaces for young people. At the moment, there are few places where teenagers can meet without spending money. If the council opened a free youth centre, students would have somewhere to study, practise music and organise activities.

Transport is another problem. If buses run less frequently in the evening, people have fewer opportunities to attend events. I believe the council should introduce more evening services. If public transport becomes more reliable, fewer residents will need to use their cars.

I also wish our community had protected some of its green areas. If we had opposed the construction of certain car parks, we might have saved more trees. However, we can still make a difference by planting new ones and improving recycling facilities.

In conclusion, a town becomes more welcoming when residents have a voice. If young people were included in local decisions, I am sure we would find creative solutions together.`}

        vocab:[['headline','titular'],['source','fuente'],['claim','afirmación'],['evidence','pruebas'],['misleading','engañoso'],['reliable','fiable'],['witness','testigo'],['broadcast','emitir / emisión']],
        grammar:[['“I am busy,” he said. → He said he ___ busy.','was'],['“We will arrive soon,” they said. → They said they ___ arrive soon.','would'],['“I have finished,” she said. → She said she ___ finished.','had'],['“Where do you live?” he asked me. → He asked me where I ___.','lived'],['“Don’t touch the screen,” the teacher said. → The teacher told us ___ touch the screen.','not to'],['“Can you help?” she asked. → She asked if I ___ help.','could']],
        reading:{title:'A headline that travelled too far',text:`On Monday morning, a dramatic headline appeared on several social media accounts: “Local school bans all mobile phones forever.” Within hours, students had shared the post hundreds of times. However, the original announcement was more limited. The school had asked pupils to keep phones in their bags during lessons, but it had not banned them completely. When journalists contacted the head teacher, she explained that the rule had been introduced to improve concentration. One student admitted that he had shared the headline without reading the full article. A media studies teacher later reminded the class to check the date, identify the original source and compare reports before sharing dramatic claims. The incident showed how quickly misleading information can spread when context is removed.`,qs:[['What was the real school rule?',['Phones must stay in bags during lessons','All phones were banned forever','Phones had to be sold'],0],['Why was the rule introduced?',['To save money','To improve concentration','To replace computers'],1],['What did the teacher recommend?',['Never read news','Share every headline','Check sources and compare reports'],2]]},
        listening:{title:'Interview with a reporter',script:`The reporter said that she had visited the flood-affected area the previous day. She explained that volunteers were delivering food and clean water. When the presenter asked how residents were feeling, she replied that many people were worried but grateful for the support. She added that the council would publish an update the following morning. She advised viewers to follow official sources rather than unverified social media posts.`,qs:[['When had the reporter visited the area?',['The previous day','The previous month','That morning'],0],['What were volunteers delivering?',['Clothes and books','Food and water','Computers'],1],['What did she advise viewers to follow?',['Rumours','Advertisements','Official sources'],2]]},
        writing:{title:'News report: what really happened?',prompt:'Write a 140–190-word news article about a school or community event. Include eyewitness comments transformed into reported speech and a balanced conclusion.',min:140,max:190,starters:['According to…','The organiser explained that…','One witness said that…','However, …'],checks:['I use at least three examples of reported speech.','I distinguish facts from opinions.','I use an informative headline and paragraphs.'],sample:`**Students Turn an Empty Space into a Community Garden**

A group of secondary school students has transformed an unused area beside their school into a small community garden. The project was completed last Friday after six weeks of work.

The students planted vegetables, flowers and several young trees. Their science teacher explained that the aim was to create an outdoor learning space and help local wildlife. She said that the pupils had planned the garden themselves and had received support from local volunteers.

One student told reporters that she had never taken part in a project like this before. She added that working outside had helped her understand the importance of teamwork. A neighbour said that the area looked much more welcoming and that residents would enjoy visiting it.

Some families expressed concerns about maintenance during the holidays. In response, the school announced that a small volunteer group would look after the plants throughout the summer.

The project demonstrates how a relatively simple idea can improve a neighbourhood when students and residents work together.`}

        grammar:[['You ___ wear a helmet on this construction site. (obligation)','must|have to'],['You ___ use your phone during the exam. (prohibition)','must not|mustn’t|mustn\'t'],['You ___ bring lunch; the school provides it. (not necessary)','do not have to|don’t have to|don\'t have to'],['She got every answer right. She ___ studied hard.','must have'],['They ___ be at home; their lights are off and the car is gone. (impossible)','can’t|cannot|can\'t'],['He ___ left his bag on the bus. (possible)','might have|may have|could have']],
        reading:{title:'A difficult choice',text:`When Ava found a wallet on the bus, she faced a simple but important decision. There was cash inside, along with a student card and a photograph. Her friend suggested leaving the wallet with the driver, but another passenger thought she should take it to the police station. Ava knew that she mustn’t keep the money. She also realised that the owner might have been worried about losing important documents. She gave the wallet to the driver and asked for a receipt. Later that day, the owner contacted the transport company and thanked her. “You must have been relieved,” Ava’s friend said. Ava smiled. She explained that returning the wallet hadn’t been difficult; deciding what to do quickly had been the challenging part.`,qs:[['Where did Ava find the wallet?',['On a bus','In a café','At school'],0],['What did she do with it?',['Kept the cash','Gave it to the driver','Put it in a bin'],1],['What had made the situation challenging?',['The documents were missing','The owner was angry','She had to decide quickly'],2]]},
        listening:{title:'A mystery at school',script:`Someone has left a violin case in the music room. It can't belong to Sam because he plays the drums. It might be Priya's; she joined the orchestra last week. But she went home early today, so she may have forgotten it. The case looks expensive, and the owner must be worried. We should give it to the school office instead of opening it. They can contact the students who use the music room.`,qs:[['Why can’t it belong to Sam?',['He plays the drums','He is absent','He has sold his violin'],0],['Who might own it?',['The caretaker','Priya','The head teacher'],1],['What should they do?',['Open the case','Take it home','Give it to the office'],2]]},
        writing:{title:'Advice column',prompt:'Write a 140–190-word advice column replying to a student who feels overwhelmed by homework and social commitments. Use obligation, advice and at least one deduction.',min:140,max:190,starters:['It sounds as if you…','You should consider…','You don’t have to…','You might have…'],checks:['I distinguish mustn’t and don’t have to.','I offer realistic and respectful advice.','I justify at least three suggestions.'],sample:`**Dear Worried Student,**

It sounds as if you have been trying to do too many things at once. You must be exhausted, especially if you are studying late every night. Although schoolwork is important, you shouldn't feel that you have to be available to everyone all the time.

First, you should make a realistic weekly plan. Write down important deadlines and decide which tasks need your attention first. You don't have to accept every invitation, and you mustn't sacrifice your sleep just to keep up with your friends.

Secondly, try talking to a teacher if your workload feels unmanageable. You might have misunderstood how much time an assignment requires, or you may need some extra guidance. Asking for help is a sensible decision, not a weakness.

Finally, remember to protect time for activities you enjoy. Even a short walk can help you feel calmer and more focused.

I hope these suggestions help you find a healthier balance.

**Best wishes,**
A fellow student`}

      {
        id:'u7',title:'People Who Inspire Us',tag:'Relative clauses & verb patterns',emoji:'🌟',
        goals:['Añadir información con relativos','Distinguir defining y non-defining clauses','Utilizar gerundios e infinitivos'],
        theory:[['Relative clauses','who (people), which (things), where (places), whose (possession), that (defining people/things).'],['Defining / non-defining','Defining: The girl who won… No commas. Non-defining: My aunt, who lives in Leeds, … commas; no “that”.'],['Verb patterns','enjoy + -ing; decide + to-infinitive; avoid + -ing; want + to-infinitive.']],
        vocab:[['determined','decidido'],['generous','generoso'],['achievement','logro'],['inspire','inspirar'],['dedication','dedicación'],['challenge','desafío'],['overcome','superar'],['legacy','legado']],
        grammar:[['That is the scientist ___ discovered the new material.','who|that'],['The town ___ I was born is near the sea.','where'],['She is the artist ___ work inspired me.','whose'],['I really enjoy ___ (learn) languages.','learning'],['He decided ___ (apply) for the competition.','to apply'],['This is the book ___ changed my opinion.','that|which']],
        reading:{title:'The coach who changed the team',text:`When Daniel joined his local basketball club, he was convinced that he had very little talent. His coach, Ms Patel, noticed something different. She saw a quiet student who listened carefully, encouraged others and refused to give up. Instead of focusing only on winning, she created exercises that helped every player improve. Daniel began enjoying practice and gradually developed confidence. Two years later, he became team captain. Although the club never won a national title, it earned a reputation for fairness and inclusion. Daniel, whose younger sister now plays for the same club, says that Ms Patel taught him much more than basketball. He learnt that leadership involves listening, supporting others and recognising strengths that people cannot always see in themselves.`,qs:[['What did the coach value?',['Only winning trophies','Improvement and inclusion','Expensive equipment'],1],['What role did Daniel eventually have?',['Team captain','Club owner','Referee'],0],['What did Daniel learn about leadership?',['Being the loudest person','Winning every match','Supporting and listening to others'],2]]},
        listening:{title:'A person I admire',script:`The person who has inspired me most is my uncle, who works as a paramedic. He has spent years helping people during emergencies, but he never talks about himself as a hero. What I admire is his patience and his willingness to listen. He encouraged me to volunteer at a community centre, where I now help younger children with their homework. I've discovered that making a difference doesn't always mean doing something dramatic. Sometimes, it simply means being reliable and kind.`,qs:[['What is the uncle’s job?',['Paramedic','Engineer','Photographer'],0],['Where does the speaker volunteer?',['At a hospital','At a community centre','At a museum'],1],['What lesson has the speaker learnt?',['Fame is essential','Every action must be dramatic','Small kind actions can matter'],2]]},
        writing:{title:'Profile: someone worth knowing',prompt:'Write a 140–190-word profile of a real or fictional person who inspires you. Include achievements, character and a reflection on what you have learnt.',min:140,max:190,starters:['One person who inspires me is…','What makes this person special is…','Despite facing…','Thanks to…, I have learnt…'],checks:['I use defining and non-defining relative clauses.','I use gerunds and infinitives correctly.','I include concrete examples, not just adjectives.'],sample:`One person who inspires me is my aunt Isabel, who works as a primary school teacher. She lives in a small town where she has spent more than twenty years helping children discover their abilities.

What makes her special is not a famous award or an extraordinary talent, but her determination to make every student feel included. She enjoys creating practical activities and never stops learning new teaching methods. Several former pupils, whose confidence grew thanks to her encouragement, still visit her years later.

Isabel has also faced challenges. When her school lost funding for an arts programme, she decided to organise a community exhibition to raise money. Rather than giving up, she persuaded families and local businesses to take part. The project was a success.

Watching her work has taught me that kindness and dedication can change lives. She reminds me to listen carefully, avoid judging people too quickly and keep trying when something seems impossible. For me, that is what real leadership means.`}

      {
        id:'u8',title:'Tomorrow’s World',tag:'Future forms & technology',emoji:'🤖',

        theory:[['Future forms','will (prediction/spontaneous decision), going to (intention/evidence), Present Continuous (arrangement).'],['Future Continuous','will be + -ing: At eight tomorrow, I’ll be travelling.'],['Future Perfect','will have + past participle: By 2030, we’ll have completed the project.']],
        vocab:[['breakthrough','avance decisivo'],['automated','automatizado'],['privacy','privacidad'],['device','dispositivo'],['innovation','innovación'],['sustainable','sostenible'],['efficient','eficiente'],['replace','sustituir']],
        grammar:[['At this time tomorrow, I ___ (fly) to Dublin.','will be flying'],['By next June, she ___ (complete) her course.','will have completed'],['Look at the sky! It ___ (snow).','is going to snow'],['We ___ (meet) the careers adviser on Thursday. (arrangement)','are meeting'],['I promise I ___ (help) you revise.','will help'],['By 2040, many cities ___ (change) their transport systems.','will have changed']],
        reading:{title:'A classroom in 2040',text:`What will schools look like in 2040? Some experts predict that personalised software will help students practise at their own pace. By then, many classrooms may have introduced flexible learning spaces, while teachers will still be responsible for helping pupils think critically and work together. Technology could make resources more accessible, but privacy will remain a serious concern. Schools will need clear rules about how student data is collected and stored. At the same time, students may spend more time developing skills that computers cannot easily replace, such as empathy, creativity and ethical judgement. No one knows exactly what education will look like, but one thing seems likely: learning will involve more than simply having the newest devices.`,qs:[['What might help students work at their own pace?',['Personalised software','Longer holidays','Fewer teachers'],0],['What concern does the article mention?',['Sports facilities','Data privacy','School uniforms'],1],['Which skill is mentioned as important?',['Typing speed','Repairing phones','Empathy'],2]]},
        listening:{title:'Predictions at the careers fair',script:`By the time you leave university, some jobs will have changed considerably. You'll probably be using tools that don't even exist today. For example, engineers will be working with cleaner energy systems, while healthcare professionals will be using improved diagnostic technology. But don't assume that every task will be automated. Employers will still need people who communicate clearly, solve problems creatively and treat others with respect. The best preparation is to stay curious and keep learning.`,qs:[['What will have changed by the time students leave university?',['Some jobs','The length of the year','All languages'],0],['What energy systems are mentioned?',['Coal-powered','Cleaner','Wooden'],1],['Which human skill remains important?',['Memorising adverts','Avoiding teamwork','Clear communication'],2]]},
        writing:{title:'Opinion essay: AI in education',prompt:'Write an opinion essay of 140–190 words: “Should students use AI tools for homework?” Address learning, fairness and your own idea. Give a clear opinion.',min:140,max:190,starters:['Nowadays, …','In my opinion, …','Firstly, …','However, …','To sum up, …'],checks:['My introduction presents a clear opinion.','I develop three reasons with examples.','I include a counterargument and a conclusion.'],sample:`**Should students use AI tools for homework?**

Artificial intelligence is becoming increasingly common in education. Although some people believe that students should never use these tools, I think they can be helpful if clear limits are established.

Firstly, AI can support learning when students use it to understand difficult ideas. For example, asking for an explanation of a grammar rule may help someone who is struggling. However, copying an entire answer prevents students from developing their own skills.

Secondly, schools need fair rules. If some students submit work written by AI while others complete it independently, teachers cannot assess progress accurately. Everyone should know what kind of assistance is permitted.

Finally, learning involves more than getting the correct answer. Making mistakes, asking questions and thinking creatively are essential parts of education. Technology should encourage these habits rather than replace them.

In conclusion, I believe students should be allowed to use AI as a study assistant, but not as a substitute for their own effort. The most important goal is genuine learning.`}

        vocab:[['furthermore','además'],['however','sin embargo'],['therefore','por lo tanto'],['nevertheless','no obstante'],['whereas','mientras que / en cambio'],['drawback','inconveniente'],['benefit','ventaja'],['overall','en conjunto']],
        grammar:[['___, I believe the advantages outweigh the disadvantages. (conclusion)','overall'],['Public transport is cheap. ___, it can be crowded. (contrast)','however|nevertheless'],['The project was expensive. ___, it was cancelled. (result)','therefore'],['___ some people disagree, I support this idea. (contrast)','although'],['One important ___ of studying abroad is independence.','benefit|advantage'],['A major ___ is the high cost of living.','drawback|disadvantage']],
        reading:{title:'Should schools start later?',text:`There is growing interest in the idea of starting secondary school later in the morning. Supporters argue that teenagers often need more sleep than they currently get. A later start could make students feel more energetic and improve concentration in class. It might also reduce the number of pupils who arrive late. However, changing the timetable would create difficulties for some families. Parents who begin work early could struggle with transport arrangements, while after-school clubs might finish later. In addition, students who travel long distances could still have to wake up early. A school that is considering the change should consult families, teachers and students before making a decision. Ultimately, the question is not simply whether more sleep is beneficial, but how schools can create a timetable that works for the whole community.`,qs:[['What benefit is mentioned?',['Better concentration','Shorter holidays','Less homework'],0],['What is a possible difficulty?',['All lessons would disappear','Family transport arrangements','Teachers would stop teaching'],1],['What does the article recommend?',['Changing the timetable without discussion','Ignoring parents','Consulting the school community'],2]]},
        listening:{title:'Feedback on an essay',script:`Your opinion essay has a clear introduction and some convincing examples. I can see what you think from the first paragraph, which is good. However, your second argument needs more development. Try adding a specific example instead of repeating the same point. Also, remember that 'however' introduces contrast, whereas 'therefore' shows a result. Your conclusion is effective, but you should check your verb tenses and punctuation before submitting the final version.`,qs:[['What is strong in the essay?',['The clear introduction','The punctuation','The title only'],0],['What needs more development?',['The conclusion','The second argument','The first sentence'],1],['What should be checked before submission?',['The font size','The page colour','Tenses and punctuation'],2]]},
        writing:{title:'Final challenge: opinion essay',prompt:'Write an opinion essay (140–190 words): “Should secondary schools start later in the morning?” Discuss sleep and energy, concentration in class and your own idea. Give your viewpoint, examples and a conclusion.',min:140,max:190,starters:['Many people argue that…','I strongly believe that…','One important reason is…','On the other hand, …','To conclude, …'],checks:['My introduction makes my opinion clear.','I cover sleep, concentration and my own idea.','I use at least three suitable linkers.','My essay is 140–190 words and has paragraphs.'],sample:`**Should secondary schools start later in the morning?**

Many teenagers struggle to get enough sleep during the school week. In my opinion, secondary schools should start later because this change could improve students’ wellbeing and their performance in lessons.

Firstly, teenagers often find it difficult to fall asleep early. If classes began at nine o’clock instead of eight, many students would have extra time to rest. As a result, they might feel more energetic and motivated throughout the day.

Secondly, better sleep could improve concentration. For example, students who arrive feeling awake are more likely to participate and remember new information. This could make lessons more productive for both teachers and pupils.

On the other hand, a later start might create problems for families and after-school activities. However, schools could adapt their schedules gradually and consult parents before introducing changes.

To conclude, I believe the benefits of starting later outweigh the disadvantages. A more flexible timetable could help teenagers learn effectively while protecting their health.`}
      }
    ]
  }
};

<script>
(() => {
  'use strict';
  const SKILLS=[['grammar','Gramática','🧠'],['vocab','Vocabulario','🗂️'],['listening','Listening','🎧'],['reading','Reading','📚'],['writing','Writing','✍️']];
  const KEY='english-lab-eso-progress-v1';
  let progress={};try{progress=JSON.parse(localStorage.getItem(KEY)||'{}');if(!progress||typeof progress!=='object')progress={};}catch(e){progress={};}
  let current={level:'1',unit:'u1',tab:'overview',card:0,flipped:false,transcript:false,sample:false};
  let speech=null;let toastTimeout=null;
  const $=(q,root=document)=>root.querySelector(q);
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const formatted=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
  const slug=s=>String(s).replace(/[^a-zA-Z0-9_-]/g,'_');
  function save(){try{localStorage.setItem(KEY,JSON.stringify(progress));}catch(e){/* private browsing may block storage */}}
  function unitData(){return COURSES[current.level].units.find(u=>u.id===current.unit)||COURSES[current.level].units[0]}
  function key(){return current.level+':'+current.unit}
  function getProgress(){return progress[key()]||(progress[key()]={})}
  function sectionData(skill){const p=getProgress();return p[skill]||(p[skill]={answers:[],checked:false,score:0})}
  function counts(u,level=current.level){const p=progress[level+':'+u.id]||{};const finished=SKILLS.filter(([sk])=>sk==='writing'?Boolean(p.writing?.done):Boolean(p[sk]?.checked)).length;return finished}
  function courseStats(){const units=COURSES[current.level].units;let done=0;let points=0;let total=0;for(const u of units){done+=counts(u);for(const k of ['grammar','vocab','reading','listening']){const s=progress[current.level+':'+u.id]?.[k];if(s?.checked){points+=s.score||0;total+=k==='grammar'?u.grammar.length:k==='vocab'?u.vocab.length:u[k].qs.length}}}return {done,total:units.length*5,score:total?Math.round(points*100/total):null};}
  function completed(skill){const p=getProgress();return skill==='writing'?Boolean(p.writing?.done):Boolean(p[skill]?.checked)}
  function normalize(s){return String(s??'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/[.!?,;:]+$/g,'').replace(/\s*\/\s*/g,' ')}
  function answerMatches(given,accepted){return String(accepted).split('|').some(a=>normalize(a)===normalize(given))}
  function scoreFor(skill,u){const s=sectionData(skill),answers=s.answers||[];if(skill==='grammar')return u.grammar.reduce((n,item,i)=>n+(answerMatches(answers[i],item[1])?1:0),0);if(skill==='vocab')return u.vocab.reduce((n,item,i)=>n+(answerMatches(answers[i],item[0])?1:0),0);return u[skill].qs.reduce((n,item,i)=>n+(String(answers[i])===String(item[2])?1:0),0)}
  function totalFor(skill,u){return skill==='grammar'?u.grammar.length:skill==='vocab'?u.vocab.length:u[skill].qs.length}
  function formatScore(skill,u){const p=sectionData(skill);if(!p.checked)return '';const total=totalFor(skill,u);return `<span class="score-summary ${p.score<total*.6?'low':''}" role="status">${p.score}/${total} correctas · ${Math.round(p.score/total*100)} %</span>`}
  function renderSide(){const u=unitData();$('#sidebar').innerHTML=`<div class="side-heading">${esc(COURSES[current.level].label)} · Unidades</div>${COURSES[current.level].units.map((x,i)=>`<button type="button" class="unit-btn ${x.id===u.id?'active':''}" data-action="unit" data-unit="${x.id}" ${x.id===u.id?'aria-current="page"':''}><span class="unit-number">${i+1}</span><span class="unit-copy"><b>${esc(x.title)}</b><small>${esc(x.tag)}</small></span><span class="unit-done">${counts(x)}/5</span></button>`).join('')}<div class="side-foot">✓ El avance se guarda solamente en este dispositivo. No se envían respuestas a ningún servidor.</div>`;
    document.querySelectorAll('[data-action="level"]').forEach(b=>{const yes=b.dataset.level===current.level;b.classList.toggle('selected',yes);b.setAttribute('aria-pressed',yes?'true':'false')});
  }
  function unitSelect(){return `<div class="mobile-unit-select"><label for="mobile-unit">Unidad</label><select id="mobile-unit" aria-label="Seleccionar unidad">${COURSES[current.level].units.map((u,i)=>`<option value="${u.id}" ${current.unit===u.id?'selected':''}>${i+1}. ${esc(u.title)}</option>`).join('')}</select></div>`}
  function goto(level,unit,tab='overview'){if(speech&&window.speechSynthesis)window.speechSynthesis.cancel();speech=null;current={...current,level,unit,tab,card:0,flipped:false,transcript:false,sample:false};location.hash=`level=${level}&unit=${unit}&tab=${tab}`;render();window.scrollTo({top:0,behavior:'auto'});}
  function navTab(tab){goto(current.level,current.unit,tab)}
  function render(){const u=unitData();renderSide();const main=$('#main');let body='';if(current.tab==='overview')body=renderHome(u);else if(current.tab==='grammar')body=renderGrammar(u);else if(current.tab==='vocab')body=renderVocab(u);else if(current.tab==='reading')body=renderReading(u);else if(current.tab==='listening')body=renderListening(u);else if(current.tab==='writing')body=renderWriting(u);
    if(current.tab==='overview'){main.innerHTML=unitSelect()+body;}else{const idx=COURSES[current.level].units.indexOf(u)+1;main.innerHTML=unitSelect()+`<div class="main-heading"><div class="unit-heading"><span class="eyebrow">${esc(COURSES[current.level].label)} / Unidad ${idx} de ${COURSES[current.level].units.length}</span><h1>${esc(u.title)}</h1><p>${esc(u.tag)}</p></div><div class="unit-bubble" aria-hidden="true">${u.emoji}</div></div>`+tabs()+body+`<div class="page-foot">English Lab · Aprende a tu ritmo · Tu profesora revisará la expresión escrita.</div>`;}}
  function tabs(){return `<nav class="tabs" role="tablist" aria-label="Destrezas de la unidad"><button type="button" role="tab" aria-selected="${current.tab==='overview'}" class="tab-btn" data-action="tab" data-tab="overview">Inicio</button>${SKILLS.map(([id,name])=>`<button type="button" role="tab" aria-selected="${current.tab===id}" class="tab-btn" data-action="tab" data-tab="${id}">${name}${completed(id)?'<span class="done-mark">✓</span>':''}</button>`).join('')}</nav>`}
  function renderHome(u){const c=COURSES[current.level],s=courseStats(),pct=Math.round(s.done/s.total*100),idx=c.units.findIndex(x=>x.id===u.id);return `<section class="intro"><span class="eyebrow">Your English journey starts here</span><h1>Practise. Improve.<br>Feel confident.</h1><p>${esc(c.sub)} Aprende con explicaciones sencillas, ejemplos, retos autocorregibles y tareas para crear tus propios textos.</p><div class="hero-meta"><span>📗 ${esc(c.label)}</span><span>🧩 9 unidades</span><span>🎯 5 destrezas</span><span>💾 Guardado local</span></div></section>
  <section class="stats" aria-label="Tu progreso"><div class="panel stat"><div class="stat-value">${pct}%</div><div class="stat-label">Actividades completadas</div></div><div class="panel stat"><div class="stat-value">${s.done}/${s.total}</div><div class="stat-label">Secciones practicadas</div></div><div class="panel stat"><div class="stat-value">${s.score===null?'—':s.score+'%'}</div><div class="stat-label">Aciertos en autocorregibles</div></div></section>
  <h2 class="section-title">Unidad ${idx+1}: ${esc(u.title)}</h2><section class="panel lesson"><span class="eyebrow">What you'll learn</span><h2>${u.emoji} ${esc(u.tag)}</h2><ul class="goal-list">${u.goals.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="divider"></div><h3>Elige qué quieres practicar</h3><div class="skill-grid">${SKILLS.map(([id,name,icon])=>`<button class="skill-tile" type="button" data-action="tab" data-tab="${id}"><strong>${icon}</strong><span>${name}</span><small>${completed(id)?'✓ Practicado':'Empezar →'}</small></button>`).join('')}</div><div class="callout beige">💡 <strong>Consejo:</strong> empieza por gramática y vocabulario. Después practica listening y reading. Termina escribiendo tu propio texto y revisándolo con la lista de control.</div></section>
  <h2 class="section-title">Explora todo el curso</h2><section class="course-grid">${c.units.map((x,i)=>`<button class="course-card" type="button" data-action="unit" data-unit="${x.id}"><div class="card-top"><span class="card-emoji">${x.emoji}</span><span class="card-index">Unit ${String(i+1).padStart(2,'0')} · ${counts(x)}/5</span></div><h3>${esc(x.title)}</h3><p>${esc(x.tag)}</p><div class="progress-track" aria-hidden="true"><div class="progress-fill" style="width:${counts(x)*20}%"></div></div></button>`).join('')}</section><div class="page-foot">Material didáctico original. No incluye contenido copiado de los libros de texto. Audios generados por las voces disponibles en tu navegador.</div>`;}
  function renderTheory(u){return `<section class="panel lesson"><span class="eyebrow">Learn the rules</span><h2>La teoría, paso a paso</h2><p class="subhead">Lee las reglas y observa los ejemplos antes de completar los ejercicios.</p><div class="info-grid">${u.theory.map(([a,b])=>`<div class="info-tile"><h3>${esc(a)}</h3><p>${esc(b)}</p></div>`).join('')}</div></section>`}
  function textQuestions(skill,arr,questioner){const s=sectionData(skill);return `<form id="exercise-form" data-skill="${skill}" novalidate><div class="question-list">${arr.map((item,i)=>{const submitted=s.checked,correct=skill==='grammar'?answerMatches(s.answers?.[i],item[1]):answerMatches(s.answers?.[i],item[0]);return `<div class="question ${submitted?(correct?'correct':'incorrect'):''}"><div class="question-header"><span class="q-number">${String(i+1).padStart(2,'0')}</span><div style="flex:1;min-width:0"><div class="q-text">${questioner(item,i)}</div><label class="sr" for="answer-${i}">Respuesta a la pregunta ${i+1}</label><input id="answer-${i}" class="answer-input" data-answer="${i}" type="text" value="${esc(s.answers?.[i]||'')}" placeholder="Escribe tu respuesta en inglés…" autocomplete="off" spellcheck="false" ${submitted?'':' '} />${submitted?`<div class="feedback ${correct?'yes':'no'}">${correct?'✓ Correct! Well done.':`✕ Respuesta: ${esc(skill==='grammar'?item[1].split('|')[0]:item[0])}${skill==='grammar'&&item[2]?` · ${esc(item[2])}`:''}`}</div>`:''}</div></div></div>`}).join('')}</div>${quizFooter(skill)}</form>`}
  function quizFooter(skill){const u=unitData();return `<div class="quiz-footer"><button type="submit" class="btn">✓ Corregir mis respuestas</button><button type="button" class="btn secondary" data-action="clear" data-skill="${skill}">Volver a intentarlo</button>${formatScore(skill,u)}</div><div class="notice">Puedes repetir las actividades tantas veces como quieras. La última nota es la que aparece en tu progreso.</div>`}
  function renderGrammar(u){return renderTheory(u)+`<section class="panel lesson"><span class="eyebrow">Practice · Complete the sentences</span><h2>Grammar Challenge</h2><p class="subhead">Escribe solo lo que falta en cada oración. Se aceptan las contracciones que se indican en las soluciones.</p>${textQuestions('grammar',u.grammar,item=>esc(item[0]))}</section>`}
  function renderVocab(u){const i=Math.min(current.card,u.vocab.length-1),v=u.vocab[i];return `<section class="panel lesson"><span class="eyebrow">Study · Word cards</span><h2>Vocabulary Flashcards</h2><p class="subhead">Mira la palabra, intenta recordarla y pulsa la tarjeta para ver su traducción.</p><button class="flashcard" type="button" data-action="flip" aria-label="Dar la vuelta a la tarjeta"><div><div class="word">${esc(current.flipped?v[1]:v[0])}</div><small>${current.flipped?'Español':'English'} · Pulsa para dar la vuelta</small></div></button><div class="flash-card-actions"><button class="btn secondary" type="button" data-action="prev-card" ${i===0?'disabled':''}>← Anterior</button><span class="flash-count">${i+1} / ${u.vocab.length}</span><button class="btn secondary" type="button" data-action="next-card" ${i===u.vocab.length-1?'disabled':''}>Siguiente →</button></div></section><section class="panel lesson"><span class="eyebrow">Practice · Spanish → English</span><h2>Can you remember?</h2><p class="subhead">Escribe la palabra inglesa que corresponde a cada definición en español.</p>${textQuestions('vocab',u.vocab,item=>esc(item[1]))}</section>`}
  function mcQuestions(skill,qs){const s=sectionData(skill);return `<form id="exercise-form" data-skill="${skill}" novalidate><div class="question-list">${qs.map((item,i)=>{const selected=s.answers?.[i];const checked=s.checked;const correct=String(selected)===String(item[2]);return `<div class="question ${checked?(correct?'correct':'incorrect'):''}"><div class="question-header"><span class="q-number">${String(i+1).padStart(2,'0')}</span><div style="flex:1;min-width:0"><div class="q-text">${esc(item[0])}</div><div class="choices" role="group" aria-label="Pregunta ${i+1}">${item[1].map((opt,j)=>`<label class="choice"><input type="radio" data-answer="${i}" name="q${i}" value="${j}" ${String(selected)===String(j)?'checked':''}><span>${esc(opt)}</span></label>`).join('')}</div>${checked?`<div class="feedback ${correct?'yes':'no'}">${correct?'✓ Correct!':`✕ Respuesta correcta: ${esc(item[1][item[2]])}`}</div>`:''}</div></div></div>`}).join('')}</div>${quizFooter(skill)}</form>`}
  function renderReading(u){return `<section class="panel lesson"><span class="eyebrow">Read · Understand · Answer</span><h2>${esc(u.reading.title)}</h2><p class="subhead">Lee atentamente el texto. Puedes volver a consultarlo mientras respondes.</p><div class="reading-passage" lang="en">${esc(u.reading.text)}</div><h3>Reading comprehension</h3>${mcQuestions('reading',u.reading.qs)}</section>`}
  function renderListening(u){return `<section class="panel lesson"><span class="eyebrow">Listen · Understand · Answer</span><h2>${esc(u.listening.title)}</h2><p class="subhead">Escucha antes de leer la transcripción. Puedes repetir el audio y modificar la velocidad.</p><div class="audio-stage"><span class="audio-art" aria-hidden="true">🎙️</span><div><div class="audio-controls"><button type="button" class="btn" data-action="speak" data-rate="0.93">▶ Escuchar</button><button type="button" class="btn secondary" data-action="speak" data-rate="0.76">▶ Más despacio</button><button type="button" class="btn secondary" data-action="stop">■ Parar</button></div><div class="audio-note">Voz en inglés británico si está disponible · Síntesis de voz del dispositivo</div></div></div><button class="btn secondary" type="button" data-action="transcript">${current.transcript?'Ocultar':'Ver'} transcripción</button>${current.transcript?`<div class="transcript" lang="en">${esc(u.listening.script)}</div>`:''}<div class="divider"></div><h3>Listening comprehension</h3>${mcQuestions('listening',u.listening.qs)}<div class="notice">Si el navegador no reproduce sonido, revisa el volumen y utiliza la transcripción como alternativa accesible.</div></section>`}
  function getWriting(){const p=getProgress();return p.writing||(p.writing={text:'',checks:[],done:false})}
  function words(s){return (String(s||'').trim().match(/\b[\p{L}\p{N}]+(?:[’'-][\p{L}\p{N}]+)*\b/gu)||[]).length}
  function renderWriting(u){const w=u.writing,p=getWriting(),n=words(p.text),ok=n>=w.min&&n<=w.max;return `<section class="panel lesson"><span class="eyebrow">Think · Plan · Write</span><h2>${esc(w.title)}</h2><p class="subhead">${esc(w.prompt)}</p><div class="callout"><strong>Objetivo: ${w.min}–${w.max} palabras.</strong> Tu borrador se guarda en este navegador mientras escribes. No se envía automáticamente al profesor.</div><div class="writing-help"><div class="help-card"><b>Sentence starters</b><ul>${w.starters.map(x=>`<li lang="en">${esc(x)}</li>`).join('')}</ul></div><div class="help-card"><b>Antes de empezar</b><ul><li>Haz un esquema rápido con tus ideas.</li><li>Separa las ideas en párrafos.</li><li>Relee las formas verbales de la unidad.</li><li>Usa ejemplos concretos para apoyar tus ideas.</li></ul></div></div><label for="draft" style="display:block;font-weight:850;font-size:14px;margin-bottom:8px">Your writing</label><textarea id="draft" class="writing-box" lang="en" spellcheck="true" placeholder="Start writing here…">${esc(p.text||'')}</textarea><div class="writing-toolbar"><div id="word-label" aria-live="polite" style="font-size:13px;font-weight:800;color:${ok?'var(--success)':'var(--muted)'}">${n} / ${w.min}–${w.max} palabras ${ok?'✓':''}</div><span style="font-size:12px;color:#6a837d">💾 Guardado automático</span></div><div class="word-progress" aria-hidden="true"><div id="word-progress-fill" style="width:${Math.min(n/w.max*100,100)}%;background:${n>w.max?'#c26355':'var(--sea)'}"></div></div><h3>Self-check · Revisa tu texto</h3><div class="check-list">${w.checks.map((c,i)=>`<label class="check-row"><input type="checkbox" data-writing-check="${i}" ${p.checks?.[i]?'checked':''}><span>${esc(c)}</span></label>`).join('')}</div><div class="quiz-footer"><button type="button" class="btn" data-action="finish-writing">✓ Marcar writing como terminado</button><button type="button" class="btn secondary" data-action="download-writing">↓ Descargar mi texto</button><button type="button" class="btn secondary" data-action="show-sample">${current.sample?'Ocultar':'Ver'} ejemplo</button></div><div id="writing-status" class="notice" aria-live="polite">${p.done?'✓ Writing marcado como terminado. Puedes seguir editándolo; el progreso se actualizará.':'Revisión automática limitada a extensión y lista de control; la calidad del inglés debe revisarla una persona.'}</div>${current.sample?`<div class="sample" lang="en">${formatted(w.sample)}</div>`:''}</section>`}
  function toast(msg){let t=$('.toast');if(t)t.remove();t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.remove(),4200)}
  function checkQuiz(skill){const u=unitData(),s=sectionData(skill);s.score=scoreFor(skill,u);s.checked=true;save();render();const form=$('#exercise-form');if(form)form.scrollIntoView({block:'center',behavior:'smooth'});toast(`Resultado: ${s.score} de ${totalFor(skill,u)} respuestas correctas.`)}
  function writingStatus(){const u=unitData(),p=getWriting(),n=words(p.text),min=u.writing.min,max=u.writing.max;const m=$('#word-label'),fill=$('#word-progress-fill');if(m){m.textContent=`${n} / ${min}–${max} palabras ${n>=min&&n<=max?'✓':''}`;m.style.color=n>=min&&n<=max?'var(--success)':'var(--muted)'}if(fill){fill.style.width=Math.min(n/max*100,100)+'%';fill.style.background=n>max?'#c26355':'var(--sea)'}}
  function doSpeak(rate){if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){toast('Este navegador no permite síntesis de voz. Consulta la transcripción.');return}window.speechSynthesis.cancel();const utt=new SpeechSynthesisUtterance(unitData().listening.script);utt.lang='en-GB';utt.rate=rate;utt.pitch=1;const voices=window.speechSynthesis.getVoices();const british=voices.find(v=>v.lang?.toLowerCase()==='en-gb')||voices.find(v=>v.lang?.toLowerCase().startsWith('en-'));if(british)utt.voice=british;utt.onerror=()=>toast('No se pudo reproducir la voz. Puedes leer la transcripción.');speech=utt;window.speechSynthesis.speak(utt)}
  function downloadFile(name,txt,type='text/plain'){const blob=new Blob([txt],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
  function exportProgress(){const rows=[['Curso','Unidad','Destreza','Completado','Aciertos','Preguntas']];for(const level of ['1','4'])for(const u of COURSES[level].units){const p=progress[level+':'+u.id]||{};for(const [id] of SKILLS){const v=p[id]||{},t=id==='writing'?'':totalFor(id,u);rows.push([COURSES[level].label,u.title,id,id==='writing'?(v.done?'Sí':'No'):(v.checked?'Sí':'No'),id==='writing'?'':(v.checked?v.score:''),t])}}const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\r\n');downloadFile('english_lab_progreso.csv',csv,'text/csv;charset=utf-8');toast('Progreso exportado en CSV. Los escritos se descargan desde Writing.');}
  function parseHash(){const params=new URLSearchParams(location.hash.replace(/^#/,'')),level=params.get('level'),unit=params.get('unit'),tab=params.get('tab');if(COURSES[level]&&COURSES[level].units.some(u=>u.id===unit)){current.level=level;current.unit=unit;current.tab=['overview',...SKILLS.map(x=>x[0])].includes(tab)?tab:'overview';current.card=0;current.flipped=false;current.transcript=false;current.sample=false;}}
  document.addEventListener('input',e=>{const el=e.target;if(el.matches('.answer-input')){const s=sectionData(current.tab);s.answers[Number(el.dataset.answer)]=el.value;s.checked=false;save();}if(el.id==='draft'){const w=getWriting();w.text=el.value;w.done=false;save();writingStatus();const status=$('#writing-status');if(status)status.textContent='Borrador guardado en este dispositivo. Revisa tu texto antes de marcarlo como terminado.'}});
  document.addEventListener('change',e=>{const el=e.target;if(el.id==='mobile-unit'){goto(current.level,el.value);return}if(el.matches('[type="radio"][data-answer]')){const s=sectionData(current.tab);s.answers[Number(el.dataset.answer)]=el.value;s.checked=false;save()}if(el.matches('[data-writing-check]')){const w=getWriting();w.checks[Number(el.dataset.writingCheck)]=el.checked;w.done=false;save()}});
  document.addEventListener('submit',e=>{if(e.target.id==='exercise-form'){e.preventDefault();checkQuiz(e.target.dataset.skill)}});
  document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action,u=unitData();switch(a){
    case 'level':goto(btn.dataset.level,'u1');break;
    case 'unit':goto(current.level,btn.dataset.unit);break;
    case 'tab':navTab(btn.dataset.tab);break;
    case 'flip':current.flipped=!current.flipped;render();break;
    case 'prev-card':current.card=Math.max(0,current.card-1);current.flipped=false;render();break;
    case 'next-card':current.card=Math.min(u.vocab.length-1,current.card+1);current.flipped=false;render();break;
    case 'clear':{const s=sectionData(btn.dataset.skill);s.answers=[];s.checked=false;s.score=0;save();render();break;}
    case 'speak':doSpeak(Number(btn.dataset.rate||.93));break;
    case 'stop':if(window.speechSynthesis)window.speechSynthesis.cancel();break;
    case 'transcript':current.transcript=!current.transcript;render();break;
    case 'show-sample':current.sample=!current.sample;render();break;
    case 'finish-writing':{const w=getWriting(),n=words(w.text),range=u.writing;if(n<range.min||n>range.max){toast(`Ajusta el texto a ${range.min}–${range.max} palabras. Ahora tiene ${n}.`);break}if(range.checks.some((_,i)=>!w.checks?.[i])){toast('Marca todos los puntos de la lista de revisión antes de terminar.');break}w.done=true;save();render();toast('Writing completado. ¡Buen trabajo!');break;}
    case 'download-writing':{const w=getWriting();if(!w.text.trim()){toast('Escribe algo antes de descargar.');break}downloadFile(`EnglishLab_${current.level}ESO_${slug(u.id)}_writing.txt`,`${COURSES[current.level].label} · ${u.title}\n${u.writing.title}\n\n${w.text}\n\nPalabras: ${words(w.text)}\n`);break;}
    case 'export':exportProgress();break;
    case 'reset':if(confirm('¿Quieres borrar todo el progreso guardado en este dispositivo? Esta acción no se puede deshacer.')){progress={};save();render();toast('Se ha reiniciado el progreso local.')}break;
  }});
  window.addEventListener('hashchange',()=>{if(speech&&window.speechSynthesis)window.speechSynthesis.cancel();parseHash();render()});
  parseHash();render();
})();
</script>
